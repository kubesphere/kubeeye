# Pod 状态检查规则
# 描述：检查 Pod 的运行状态，包括崩溃循环和未就绪状态
---
apiVersion: kubeeye.kubesphere.io/v1alpha2
kind: InspectRule
metadata:
  name: pod-state-monitoring
spec:
  prometheus:
    endpoint: http://prometheus-k8s.kubesphere-monitoring-system.svc.cluster.local:9090
  promQL:
    - name: KubePodCrashLooping
      rule: max_over_time(kube_pod_container_status_waiting_reason{job="kube-state-metrics",reason="CrashLoopBackOff"}[5m]) >= 1
      desc: Pod 处于崩溃循环状态
    - name: KubePodNotReady
      rule: sum by(namespace, pod) (max by(namespace, pod) (kube_pod_status_phase{job="kube-state-metrics",phase=~"Pending|Unknown"}) * on(namespace, pod) group_left(owner_kind) topk by(namespace, pod) (1, max by(namespace, pod, owner_kind) (kube_pod_owner{owner_kind!="Job"}))) > 0
      desc: Pod 处于非就绪状态超过 15 分钟
    - name: KubePodImagePullBackOff
      rule: kube_pod_container_status_waiting_reason{reason="ImagePullBackOff"} == 1
      desc: Pod 容器镜像拉取失败
    - name: KubePodContainerTerminated
      rule: kube_pod_container_status_terminated_reason{reason!~"Completed|Error"} == 1
      desc: Pod 容器异常终止
    - name: KubePodInitContainerWaiting
      rule: kube_pod_init_container_status_waiting{reason!="PodInitializing"} == 1
      desc: Pod 初始化容器处于等待状态
