# Pod 容器配置检查规则
# 描述：检查 Pod 容器的配置，包括镜像拉取策略、健康探针等
---
apiVersion: kubeeye.kubesphere.io/v1alpha2
kind: InspectRule
metadata:
  name: pod-container-config-check
spec:
  opas:
  - name: imagePullPolicyRuleForPod
    rule: |-
      package inspect.kubeeye
      import rego.v1

      deny contains msg if {
  
          input.kind == "Pod"
          input.apiVersion == "v1"
  
          level := "WARNING"
          
          not input.metadata.ownerReferences
          container := input.spec.containers[_]
          container.imagePullPolicy != "IfNotPresent"
  
          msg := {
              "Name": sprintf("%v", [input.metadata.name]),
              "Namespace": sprintf("%v", [input.metadata.namespace]),
              "Type": sprintf("%v", [input.kind]),
              "Message": "Pod镜像拉取策略规则",
              "Reason": sprintf("当前资源镜像拉取策略为: %v , 需要修改为IfNotPresent", [container.imagePullPolicy]),
              "Level": sprintf("%v", [level])
          }
      }
  - name: imageTagLatestRuleForPod
    rule: |-
      package inspect.kubeeye
      import rego.v1

      deny contains msg if {
  
          input.kind == "Pod"
          input.apiVersion == "v1"
  
          level := "WARNING"
          
          not input.metadata.ownerReferences
          container := input.spec.containers[_]
          
          # 检查镜像是否使用 latest 标签
          image_parts := split(container.image, ":")
          count(image_parts) == 1  # 没有指定标签，默认为 latest
  
          msg := {
              "Name": sprintf("%v", [input.metadata.name]),
              "Namespace": sprintf("%v", [input.metadata.namespace]),
              "Type": sprintf("%v", [input.kind]),
              "Message": "Pod镜像标签检查规则",
              "Reason": sprintf("容器 %v 使用的镜像 %v 没有指定版本标签，将使用 latest 标签，建议指定明确的版本号", [container.name, container.image]),
              "Level": sprintf("%v", [level])
          }
      }

      deny contains msg if {
  
          input.kind == "Pod"
          input.apiVersion == "v1"
  
          level := "WARNING"
          
          not input.metadata.ownerReferences
          container := input.spec.containers[_]
          
          # 检查镜像是否明确使用 latest 标签
          image_parts := split(container.image, ":")
          count(image_parts) >= 2
          image_parts[1] == "latest"
  
          msg := {
              "Name": sprintf("%v", [input.metadata.name]),
              "Namespace": sprintf("%v", [input.metadata.namespace]),
              "Type": sprintf("%v", [input.kind]),
              "Message": "Pod镜像标签检查规则",
              "Reason": sprintf("容器 %v 使用的镜像 %v 明确指定了 latest 标签，建议使用具体的版本号", [container.name, container.image]),
              "Level": sprintf("%v", [level])
          }
      }

