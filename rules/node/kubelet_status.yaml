---
# kubelet服务状态检查规则
id: node_kubelet_status
name: kubelet服务状态检查
description: 检查kubelet服务是否正常运行
type: node
category: service
severity: critical
enabled: true
tier: basic

# 规则配置
config:
  # 执行配置 - 直接返回服务状态
  execution:
    command: "systemctl is-active kubelet 2>/dev/null || echo 'inactive'"
    timeout: 5

  # 断言配置 - 直接使用命令输出
  assertions:
    - name: "kubelet服务正常"
      condition: "output.strip() == 'active'"
      severity: critical
      description: "kubelet服务状态: {{ output }}"

# 问题解决建议
solution: |
  kubelet服务异常处理：
  1. 查看服务状态：systemctl status kubelet
  2. 查看日志：journalctl -u kubelet -f
  3. 检查配置文件：/etc/kubernetes/kubelet/kubelet-config.yaml
  4. 联系系统管理员进行 kubelet 服务重启（如需要）

# 标签
tags:
  - service
  - kubelet
  - kubernetes
