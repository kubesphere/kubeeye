---
# 节点存活性检查规则
id: node_ping_check
name: 节点存活性检查
description: 检查节点是否能正常响应ping命令，确保基本的网络连通性正常
type: node
category: system
severity: info
enabled: true
tier: basic  # 基础层规则，适用于所有集群

# 规则配置
config:
  # 执行配置
  execution:
    command: "ping -c 1 127.0.0.1 | grep '1 received'"
    parser: "simple_ping_parser"
    timeout: 10
  
  # 阈值配置
  thresholds:
    expected_value: 0  # 返回值为0表示成功
  
  # 应用范围
  scope:
    node_selector: {}  # 空选择器表示应用到所有节点

# 问题解决建议
solution: |
  如果节点无法响应ping命令，请按照以下步骤排查网络和主机状态：
  1. 检查节点的网络配置是否正确
  2. 确认防火墙规则是否屏蔽了ICMP包
  3. 检查节点的物理连接和网络设备状态
  4. 验证节点的DNS配置是否正确
  5. 使用其他网络工具(如telnet)验证连接性

# 标签，用于过滤和分组
tags:
  - connectivity
  - network
  - ping
  - node
