---
id: data_disk_check
name: 数据盘使用率检查
description: 检查数据盘的磁盘使用率是否超过阈值
category: system
type: node
severity: warning
enabled: true

config:
  execution:
    command: "df -h /data | awk 'NR==2{print $5}' | tr -d '%'"
    parser: "custom_disk_parser"
    timeout: 30
    
    # 解析器配置 - 这些参数会直接传递给解析器
    parser_config:
      warning_threshold: 75  # 警告阈值
      critical_threshold: 85  # 严重阈值
      mount_point: "/data"    # 要检查的挂载点
      
  # 规则阈值配置 - 作为备选参数来源
  threshold:
    warning: 75
    critical: 85
    
  # 执行范围配置
  scope:
    node_selector: {}  # 空选择器表示应用到所有节点

solution: |
  磁盘使用率过高，建议采取以下措施:
  1. 清理临时文件和日志
  2. 检查是否有异常占用磁盘空间的进程或服务
  3. 考虑增加磁盘容量或扩容存储

tags:
  - disk
  - storage
  - performance
  - optimized
