---
# 内存使用率检查规则
id: node_memory_usage_simple
name: 内存使用率检查
description: 检查系统内存使用率
type: node
category: memory
severity: warning
enabled: true
tier: basic

# 规则配置
config:
  # 执行配置 - 直接返回内存使用率百分比
  execution:
    command: "free | awk 'NR==2{printf \"%.0f\", $3*100/$2 }'"
    timeout: 5

  # 断言配置 - 直接使用命令输出
  assertions:
    - name: "内存使用率正常"
      condition: "int(output) < 90"
      severity: warning
      description: "内存使用率: {{ output }}%"

# 问题解决建议
solution: |
  内存使用率过高处理：
  1. 查看内存详情：free -h
  2. 查看进程内存使用：ps aux --sort=-%mem | head
  3. 清理缓存：echo 3 > /proc/sys/vm/drop_caches
  4. 检查内存泄漏进程

# 标签
tags:
  - memory
  - usage
