---
id: node_disk_usage
name: 根分区磁盘使用率检查
description: 检查节点根分区（/）磁盘使用率是否超过阈值，磁盘空间不足会导致Pod创建失败和系统不稳定
category: system
type: node
severity: warning
enabled: true
tier: basic  # 基础层规则，适用于所有集群

config:
  execution:
    command: "df -h / | awk 'NR==2{print $5}' | tr -d '%'"
    parser: "disk_usage_parser"
    timeout: 30
    parser_config:
      warning_threshold: 80
      critical_threshold: 90
      mount_point: "/"
  thresholds:
    warning:
      disk_percent: 80
    critical:
      disk_percent: 90
  scope:
    node_selector: {}

solution: |
  根分区磁盘使用率过高，请清理无用文件或扩容磁盘。

tags:
  - disk
  - system
  - node
