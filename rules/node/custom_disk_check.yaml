---
id: custom_disk_check
name: 自定义磁盘检查
category: system
type: node
severity: warning
enabled: true

config:
  execution:
    command: "df -h /data | awk 'NR==2{print $5}' | tr -d '%'"
    parser: "custom_disk_parser"
    timeout: 30
    parser_config:
      warning_threshold: 80
      critical_threshold: 90
      mount_point: "/data"
  threshold:
    warning: 80
    critical: 90
  scope:
    node_selector: {}

solution: |
  检查/data分区磁盘使用率过高，请清理无用文件或扩容磁盘。

tags:
  - disk
  - custom
  - node