---
# 节点 CPU 负载检查规则
id: node_cpu_load
name: CPU 负载检查
description: 检查节点 CPU 负载是否过高，负载过高可能导致系统响应缓慢和任务调度延迟
type: node
category: system
severity: warning
enabled: true
tier: basic  # 基础层规则，适用于所有集群

# 规则配置
config:
  # 执行配置
  execution:
    command: "uptime"  # 要执行的命令
    parser: "uptime_output"  # 结果解析器
    timeout: 30  # 执行超时时间（秒）
    dependencies:  # 依赖命令
      cpu_cores: "nproc"  # 获取CPU核心数的命令

  # 阈值配置 - 使用thresholds替代threshold
  thresholds:
    warning:
      load_per_core: 1.0  # 每核平均负载超过1.0触发警告
    critical:
      load_per_core: 2.0  # 每核平均负载超过2.0触发严重警告

  # 应用范围
  scope:
    node_selector:  # 节点选择器，为空表示适用于所有节点
      # kubernetes.io/role: worker  # 可以添加标签选择器

# 问题解决建议
solution: |
  CPU负载过高，请检查：
  1. 使用 'top' 命令查看高占用进程，定位消耗资源较多的应用
  2. 检查是否有异常或恶意进程
  3. 使用 'dmesg' 命令查看系统日志，寻找可能的硬件或驱动问题
  4. 优化应用代码或配置，降低资源消耗
  5. 考虑为节点增加计算资源或平衡工作负载
  6. 调整Pod的资源请求和限制，防止单个Pod过度使用资源

# 标签，用于过滤和分组
tags:
  - cpu
  - performance
  - system
  - load
