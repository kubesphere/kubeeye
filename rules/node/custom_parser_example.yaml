# 自定义解析器示例规则
---
id: node_custom_parser_example
name: 自定义解析器示例规则
description: 使用自定义解析器的示例规则，展示如何使用自定义参数配置解析器行为
type: node
category: example
severity: info
enabled: true
tier: extended  # 扩展层规则，主要用于示例

# 规则配置
config:
  # 执行配置
  execution:
    command: "echo 75"  # 简单示例命令，返回固定值75
    parser: "custom_memory_parser"  # 使用自定义解析器
    timeout: 30  # 执行超时时间（秒）
    
    # 自定义解析器配置
    parser_config:
      warning_threshold: 70    # 警告阈值
      critical_threshold: 90   # 严重阈值
      description_prefix: "自定义内存检查示例"  # 结果描述前缀
  
  # 阈值配置 - 新格式使用thresholds，而不是threshold
  thresholds:
    warning:
      value: 70
    critical:
      value: 90
  
  # 应用范围
  scope:
    node_selector: {}  # 空选择器表示应用到所有节点

# 问题解决建议
solution: |
  此规则仅用于演示，没有实际修复建议。
  实际规则应该在这里提供有关如何解决问题的详细指导。

# 标签，用于过滤和分组
tags:
  - custom
  - example
  - parser-demo
