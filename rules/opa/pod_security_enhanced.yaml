---
# Pod安全上下文增强检查规则
id: opa_pod_security_enhanced
name: Pod安全上下文增强检查
description: 检查Pod和容器是否配置了适当的安全上下文，包括非root用户运行、禁用特权模式和特权提升等安全配置
type: opa
category: security
severity: warning
enabled: true
tier: standard  # 标准层规则，适用于安全敏感的生产环境

# 规则配置
config:
  # 资源配置
  resources:
    - kind: Pod
      apiVersion: v1
      namespaced: true
    - kind: Deployment
      apiVersion: apps/v1
      namespaced: true
    - kind: DaemonSet
      apiVersion: apps/v1
      namespaced: true
    - kind: StatefulSet
      apiVersion: apps/v1
      namespaced: true
  
  # 范围配置
  scope:
    namespaces:
      include:
        - default
        - kube-system
      exclude:
        - kube-node-lease
        - kube-public
  # Rego规则配置
  rego:
    # 内联Rego规则定义
    inline: |
      package kubernetes.pods
      
      # 获取Pod规范 - 直接来自Pod资源或从控制器的模板中获取
      get_pod_spec(resource) = spec {
          # 直接是Pod资源
          resource.kind == "Pod"
          spec := resource.spec
      }
      
      # 从Deployment获取Pod规范
      get_pod_spec(resource) = spec {
          resource.kind == "Deployment"
          spec := resource.spec.template.spec
      }
      
      # 从DaemonSet获取Pod规范
      get_pod_spec(resource) = spec {
          resource.kind == "DaemonSet"
          spec := resource.spec.template.spec
      }
      
      # 从StatefulSet获取Pod规范
      get_pod_spec(resource) = spec {
          resource.kind == "StatefulSet"
          spec := resource.spec.template.spec
      }
      
      # 检查Pod是否具有安全上下文设置
      deny[result] {
          resource := input
          spec := get_pod_spec(resource)
          
          not spec.securityContext
          
          result := {
            "name": resource.metadata.name,
            "namespace": resource.metadata.namespace,
            "message": "Pod缺少安全上下文配置",
            "severity": "warning"
          }
      }
      
      # 检查容器是否以非root用户运行
      deny[result] {
          resource := input
          spec := get_pod_spec(resource)
          
          container := spec.containers[i]
          not container.securityContext.runAsNonRoot
          
          result := {
            "name": resource.metadata.name,
            "namespace": resource.metadata.namespace,
            "message": sprintf("容器 '%s' 没有设置runAsNonRoot", [container.name]),
            "severity": "warning"
          }
      }
      
      # 检查特权容器
      deny[result] {
          resource := input
          spec := get_pod_spec(resource)
                   container := spec.containers[i]
          container.securityContext.privileged
          
          result := {
            "name": resource.metadata.name,
            "namespace": resource.metadata.namespace,
            "message": sprintf("容器 '%s' 以特权模式运行", [container.name]),
            "severity": "warning"
          }
      }
      
      # 检查容器是否允许特权提升
      deny[result] {
          resource := input
          spec := get_pod_spec(resource)
          
          container := spec.containers[i]
          container.securityContext.allowPrivilegeEscalation == true
          
          result := {
            "name": resource.metadata.name,
            "namespace": resource.metadata.namespace,
            "message": sprintf("容器 '%s' 允许特权提升", [container.name]),
            "severity": "warning"
          }
      }
  
  # 豁免列表
  exemptions:
    - name: "kube-apiserver"
      namespace: "kube-system"
      reason: "系统组件需要特权访问"
    - name: "kube-controller-manager"
      namespace: "kube-system"
      reason: "系统组件需要特权访问"
    - name: "kube-scheduler"
      namespace: "kube-system"
      reason: "系统组件需要特权访问"

# 问题解决建议
solution: |
  为确保Pod和容器以安全的方式运行，请实施以下最佳实践:
  
  1. 为Pod配置安全上下文:
     ```yaml
     spec:
       securityContext:
         runAsNonRoot: true
         runAsUser: 1000
         runAsGroup: 3000
         fsGroup: 2000
     ```
  
  2. 为每个容器配置安全上下文:
     ```yaml
     containers:
       - name: app
         securityContext:
           runAsNonRoot: true
           allowPrivilegeEscalation: false
           privileged: false
           capabilities:
             drop:
               - ALL
     ```
  
  3. 使用PodSecurityPolicy或Pod Security Standards限制特权访问:
     - 在Kubernetes 1.25+中部署Pod Security Standards (PSS)
     - 在1.25之前的版本中使用PodSecurityPolicy
  
  4. 定期审计现有Pod和工作负载的安全配置
  
  5. 考虑使用第三方工具如OPA/Gatekeeper或Kyverno强制执行安全策略

# 标签，用于过滤和分组
tags:
  - security
  - pod
  - compliance
  - container
  - privilege
  - pss
  - hardening
