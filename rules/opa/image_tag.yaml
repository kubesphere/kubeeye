---
# 容器镜像标签规范检查规则
id: opa_image_tag_check
name: 容器镜像标签规范检查
description: 检查容器镜像是否使用了特定标签而非latest标签，使用latest标签可能导致不可预期的版本变更和部署不稳定
type: opa
category: security
severity: warning
enabled: true
tier: standard  # 标准层规则，适用于生产环境

# 规则配置
config:
  # 资源配置
  resources:
    - kind: Pod
      apiVersion: v1
      namespaced: true
    - kind: Deployment
      apiVersion: apps/v1
      namespaced: true
    - kind: DaemonSet
      apiVersion: apps/v1
      namespaced: true
    - kind: StatefulSet
      apiVersion: apps/v1
      namespaced: true

  # 范围配置
  scope:
    namespaces:
      include: []  # 空数组表示所有非排除的命名空间
      exclude:
        - kube-system
        - kube-public
        - kube-node-lease
    
  # Rego规则配置
  rego:
    # 内联Rego规则定义
    inline: |
      package kubernetes.images
      
      # 获取Pod规范 - 直接来自Pod资源或从控制器的模板中获取
      get_pod_spec(resource) = spec {
          # 直接是Pod资源
          resource.kind == "Pod"
          spec := resource.spec
      }
      
      # 从Deployment获取Pod规范
      get_pod_spec(resource) = spec {
          resource.kind == "Deployment"
          spec := resource.spec.template.spec
      }
      
      # 从DaemonSet获取Pod规范
      get_pod_spec(resource) = spec {
          resource.kind == "DaemonSet"
          spec := resource.spec.template.spec
      }
      
      # 从StatefulSet获取Pod规范
      get_pod_spec(resource) = spec {
          resource.kind == "StatefulSet"
          spec := resource.spec.template.spec
      }
      
      # 检查容器镜像是否使用 latest 标签
      deny[result] {
          resource := input
          spec := get_pod_spec(resource)
          
          container := spec.containers[i]
          endswith(container.image, ":latest")
          
          result := {
            "name": resource.metadata.name,
            "namespace": resource.metadata.namespace,
            "message": sprintf("容器 '%s' 使用了 latest 标签的镜像", [container.name]),
            "severity": "warning"
          }
      }
      
      # 检查容器镜像是否未指定标签
      deny[result] {
          resource := input
          spec := get_pod_spec(resource)
          
          container := spec.containers[i]
          not contains(container.image, ":")
          
          result := {
            "name": resource.metadata.name,
            "namespace": resource.metadata.namespace,
            "message": sprintf("容器 '%s' 的镜像未指定标签", [container.name]),
            "severity": "warning"
          }
      }

  # 豁免列表
  exemptions:
    - name: "init-container"
      namespace: "default"
      reason: "初始化容器允许使用latest标签"

# 问题解决建议
solution: |
  为确保容器部署的可预测性和稳定性，请避免使用latest镜像标签:
  
  1. 为所有容器镜像指定明确的版本标签，例如: nginx:1.21.6 而不是 nginx:latest
  2. 在Deployment、StatefulSet、DaemonSet和Pod定义中检查并修改容器镜像配置
  3. 使用语义化版本(semantic versioning)标签管理镜像版本
  4. 建立镜像标签规范并在CI/CD流程中实施
  5. 考虑设置镜像拉取策略为 "IfNotPresent" 或 "Never"，避免不必要的镜像更新:
     ```yaml
     imagePullPolicy: IfNotPresent
     ```

# 标签，用于过滤和分组
tags:
  - image
  - security
  - best-practice
  - versioning
  - stability
