---
# 资源请求检查规则
id: opa_resource_requests
name: 资源请求检查
description: 检查Pod容器是否配置了资源请求，包括CPU和内存请求，确保Kubernetes调度器能够正确分配资源
type: opa
category: performance
severity: warning
enabled: true
tier: basic  # 基础层规则，适用于所有集群

# 规则配置
config:
  # 资源配置
  resources:
    - kind: Pod
      apiVersion: v1
      namespaced: true
    - kind: Deployment
      apiVersion: apps/v1
      namespaced: true
    - kind: DaemonSet
      apiVersion: apps/v1
      namespaced: true
    - kind: StatefulSet
      apiVersion: apps/v1
      namespaced: true
  
  # 范围配置
  scope:
    namespaces:
      include:
        - default
      exclude:
        - kube-system
        - kube-public
        - kube-node-lease

  # 阈值配置
  thresholds:
    value: true

  # Rego规则配置
  rego:
    # 内联Rego规则定义
    inline: |
      package kubernetes.resources
      
      # 获取Pod规范 - 直接来自Pod资源或从控制器的模板中获取
      get_pod_spec(resource) = spec {
          # 直接是Pod资源
          resource.kind == "Pod"
          spec := resource.spec
      }
      
      # 从Deployment获取Pod规范
      get_pod_spec(resource) = spec {
          resource.kind == "Deployment"
          spec := resource.spec.template.spec
      }
      
      # 从DaemonSet获取Pod规范
      get_pod_spec(resource) = spec {
          resource.kind == "DaemonSet"
          spec := resource.spec.template.spec
      }
      
      # 从StatefulSet获取Pod规范
      get_pod_spec(resource) = spec {
          resource.kind == "StatefulSet"
          spec := resource.spec.template.spec
      }
      
      # 检查 Pod 容器是否设置了资源配置
      deny[result] {
          resource := input
          spec := get_pod_spec(resource)
          
          container := spec.containers[i]
          not container.resources
          
          result := {
            "name": resource.metadata.name,
            "namespace": resource.metadata.namespace,
            "message": sprintf("容器 '%s' 未设置resources配置", [container.name]),
            "severity": "warning"
          }
      }
      
      # 检查容器是否缺少资源请求
      deny[result] {
          resource := input
          spec := get_pod_spec(resource)
          
          container := spec.containers[i]
          container.resources
          not container.resources.requests
          
          result := {
            "name": resource.metadata.name,
            "namespace": resource.metadata.namespace,
            "message": sprintf("容器 '%s' 未设置资源请求(requests)", [container.name]),
            "severity": "warning"
          }
      }
      
      # 检查容器是否缺少CPU请求
      deny[result] {
          resource := input
          spec := get_pod_spec(resource)
          
          container := spec.containers[i]
          container.resources.requests
          not container.resources.requests.cpu
      
          result := {
            "name": resource.metadata.name,
            "namespace": resource.metadata.namespace,
            "message": sprintf("容器 '%s' 未设置CPU请求", [container.name]),
            "severity": "warning"
          }
      }
      
      # 检查容器是否缺少内存请求
      deny[result] {
          resource := input
          spec := get_pod_spec(resource)
          
          container := spec.containers[i]
          container.resources.requests
          not container.resources.requests.memory
          
          result := {
            "name": resource.metadata.name,
            "namespace": resource.metadata.namespace,
            "message": sprintf("容器 '%s' 未设置内存请求", [container.name]),
            "severity": "warning"
          }
      }
  
  # 豁免列表
  exemptions:
    - name: "minimal-app"
      namespace: "test"
      reason: "测试应用，允许无资源限制"

# 问题解决建议
solution: |
  为确保合理的资源分配和调度，所有容器都应当设置资源请求:
  
  1. 为每个容器添加资源请求配置:
     ```yaml
     resources:
       requests:
         cpu: 100m      # 根据应用需求设置适当值
         memory: 128Mi  # 根据应用需求设置适当值
     ```
  
  2. 资源请求的最佳实践:
     - 通过监控历史资源使用情况来确定合适的请求值
     - CPU请求值设置为应用平均使用量
     - 内存请求值设置为应用稳定运行所需的最小内存
     - 定期审查和调整资源请求以匹配实际需求
  
  3. 使用 Vertical Pod Autoscaler (VPA) 自动确定资源请求值:
     ```bash
     kubectl apply -f vpa.yaml
     ```
  
  4. 在命名空间级别设置默认资源请求的LimitRange:
     ```yaml
     apiVersion: v1
     kind: LimitRange
     metadata:
       name: default-requests
     spec:
       limits:
       - defaultRequest:
           cpu: 100m
           memory: 128Mi
         type: Container
     ```

# 标签，用于过滤和分组
tags:
  - resources
  - performance
  - best-practice
  - scheduling
  - efficiency
