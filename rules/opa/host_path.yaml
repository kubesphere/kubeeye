---
# OPA规则 - 主机路径挂载检查 - 简化版本
id: opa_host_path
name: Pod主机路径挂载检查
description: 检查Pod是否挂载了主机路径，一个规则一个检查项
type: opa
category: security
severity: critical
enabled: true
tier: basic

# 规则配置
config:
  # 资源配置
  resources:
    - kind: Pod
      apiVersion: v1
      namespaced: true
    - kind: Deployment
      apiVersion: apps/v1
      namespaced: true
    - kind: StatefulSet
      apiVersion: apps/v1
      namespaced: true
    - kind: DaemonSet
      apiVersion: apps/v1
      namespaced: true

  # Rego规则配置
  rego:
    inline: |
      package kubernetes
      
      # 获取Pod规范
      get_pod_spec(resource) = spec if {
          resource.kind == "Pod"
          spec := resource.spec
      }
      
      get_pod_spec(resource) = spec if {
          resource.kind != "Pod"
          spec := resource.spec.template.spec
      }
      
      # 检查主机路径挂载
      host_path_volumes(volumes) = host_paths if {
          host_paths := [volume |
              volume := volumes[_]
              volume.hostPath
          ]
      }
      
      # 定义违规
      violations contains result if {
          resource := input.resources[_]
          spec := get_pod_spec(resource)
          volumes := default_array(spec.volumes)
          host_paths := host_path_volumes(volumes)
          count(host_paths) > 0
          
          result := {
              "kind": resource.kind,
              "name": resource.metadata.name,
              "namespace": resource.metadata.namespace,
              "message": sprintf("%s '%s' in namespace '%s' mounts %d host path volume(s): %s", [
                  resource.kind,
                  resource.metadata.name,
                  resource.metadata.namespace,
                  count(host_paths),
                  concat(", ", [v.name | v := host_paths[_]])
              ])
          }
      }
      
      # 辅助函数
      default_array(val) = result if {
          val != null
          result = val
      }
      
      default_array(val) = [] if {
          val == null
      }
  
  # 断言配置
  assertions:
    - name: "检查主机路径挂载"
      condition: "violation_count == 0"
      severity: critical
      description: "发现 {{ violation_count }} 个主机路径挂载"

# 问题解决建议
solution: |
  主机路径挂载安全风险处理：
  1. 避免挂载主机路径，特别是敏感目录如/、/etc、/var
  2. 使用PersistentVolume和PersistentVolumeClaim
  3. 如必须使用，限制挂载路径并设置只读模式

# 标签
tags:
  - security
  - volumes
  - hostPath
