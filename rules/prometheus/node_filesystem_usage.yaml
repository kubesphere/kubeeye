---
# 节点文件系统使用率检查规则
id: prometheus_node_filesystem_usage
name: 节点文件系统使用率检查
description: 通过Prometheus监控节点文件系统使用率，及时发现存储空间不足的问题
type: prometheus
category: storage
severity: warning
enabled: true
tier: basic  # 基础层规则，适用于所有集群

# 规则配置
config:
  # 查询配置
  query:
    promql: '100 - ((node_filesystem_avail_bytes{mountpoint="/"} * 100) / node_filesystem_size_bytes{mountpoint="/"})'  # PromQL查询表达式
    duration: "5m"              # 查询时间范围
    interval: "1m"              # 查询间隔
  
  # 阈值配置
  thresholds:
    warning: 80                 # 使用率超过80%触发警告
    critical: 90                # 使用率超过90%触发严重警告
    comparator: ">"             # 比较操作符: >
  
  # 告警配置
  alert:
    summary: "节点{{$labels.instance}}文件系统使用率过高"        # 告警摘要
    description: "节点{{$labels.instance}}的文件系统使用率为{{$value}}%，超过阈值"    # 告警描述

# 问题解决建议
solution: |
  节点文件系统使用率过高可能导致应用无法写入数据或系统不稳定。请采取以下措施:
  
  1. 查找和删除不必要的大文件:
     ```bash
     # 查找大于1GB的文件
     find / -type f -size +1G -exec ls -lh {} \; | sort -k5,5 -h
     
     # 查找并分析日志文件
     du -ah /var/log/ | sort -hr | head -n 20
     ```
  
  2. 清理容器和镜像占用的空间:
     ```bash
     # 删除未使用的容器
     docker container prune -f
     
     # 删除未使用的镜像
     docker image prune -a -f
     
     # 清理构建缓存
     docker builder prune -f
     ```
  
  3. 清理临时文件和日志:
     ```bash
     # 清理临时文件
     rm -rf /tmp/*
     
     # 压缩或删除旧日志
     find /var/log -name "*.log.*" -mtime +7 -delete
     ```
  
  4. 如果是长期解决方案，考虑:
     - 扩展磁盘容量
     - 添加新的存储卷并迁移数据
     - 设置日志轮转策略
     - 实施存储监控和自动清理策略

# 标签，用于过滤和分组
tags:
  - filesystem
  - storage
  - node
  - disk
  - capacity
