---
# 集群内存使用率检查
id: prom_cluster_memory_usage
name: 集群内存使用率检查
description: 检查整个集群的内存使用率
type: prometheus
category: cluster
severity: warning
enabled: true
tier: cluster

# 规则配置
config:
  # Prometheus查询配置 - 集群整体内存使用率
  query: "(1 - (sum(node_memory_MemAvailable_bytes) / sum(node_memory_MemTotal_bytes))) * 100"
  
  # 时间范围配置
  time_range:
    start: "now-10m"
    end: "now"
    step: "1m"
  
  # 断言配置
  assertions:
    - name: "集群内存使用率正常"
      condition: "max_value < 80"
      severity: warning
      description: "集群内存使用率: {{ max_value | round(2) }}%"

# 标签
tags:
  - cluster
  - memory
  - performance
