---
# Pod 内存限制使用率检查
id: prom_pod_memory_limit_usage
name: Pod内存限制使用率检查
description: 检查Pod的内存使用率是否接近其限制值
type: prometheus
category: workload
severity: warning
enabled: true
tier: basic

# 规则配置
config:
  # Prometheus查询配置 - Pod内存使用率相对于其限制
  query: "(container_memory_working_set_bytes{container!=\"\"} / on(container,pod,namespace) kube_pod_container_resource_limits{resource=\"memory\"}) * 100"
  
  # 时间范围配置
  time_range:
    start: "now-10m"
    end: "now"
    step: "1m"

  # 断言配置
  assertions:
    - name: "Pod内存限制使用率检查"
      condition: "max_value < 85"
      severity: warning
      description: "Pod内存使用率: {{ max_value | round(2) }}%"

# 标签
tags:
  - pod
  - memory
  - workload
  - limits
