---
# 内存使用率检查规则 - 严重阈值
id: prom_memory_usage_critical
name: 节点内存使用率严重告警
description: 检查节点内存使用率是否超过严重阈值
type: prometheus
category: resource
severity: critical
enabled: true
tier: basic

# 规则配置
config:
  # Prometheus查询配置 - 直接返回内存使用率
  query: "(1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100"
  
  # 时间范围配置
  time_range:
    start: "now-10m"
    end: "now"
    step: "1m"

  # 断言配置
  assertions:
    - name: "节点内存使用率严重告警"
      condition: "max_value < 95"
      severity: critical
      description: "节点内存使用率: {{ max_value | round(2) }}%"

# 标签
tags:
  - memory
  - performance
  - critical
