---
# 节点内存使用率检查规则
id: prometheus_node_memory_usage
name: 节点内存使用率检查
description: 通过Prometheus监控节点内存使用率，及时发现和处理内存压力问题
type: prometheus
category: performance
severity: warning
enabled: true
tier: basic  # 基础层规则，适用于所有集群

# 规则配置
config:
  # 查询配置
  query:
    promql: '100 - ((node_memory_MemAvailable_bytes * 100) / node_memory_MemTotal_bytes)'  # PromQL查询表达式
    duration: "5m"              # 查询时间范围
    interval: "1m"              # 查询间隔
  
  # 阈值配置
  thresholds:
    warning: 80                 # 使用率超过80%触发警告
    critical: 90                # 使用率超过90%触发严重警告
    comparator: ">"             # 比较操作符: >
  
  # 告警配置
  alert:
    summary: "节点{{$labels.instance}}内存使用率过高"        # 告警摘要
    description: "节点{{$labels.instance}}的内存使用率为{{$value}}%，超过阈值"    # 告警描述

# 问题解决建议
solution: |
  节点内存使用率过高可能导致性能下降、OOM Killer触发或应用崩溃。请按照以下步骤排查和解决:
  
  1. 识别占用内存较多的进程和Pod:
     ```bash
     # 在节点上查看内存使用情况
     ps -eo pid,ppid,cmd,%mem,%cpu --sort=-%mem | head -n 10
     
     # 查看Pod资源使用情况
     kubectl top pods -A --sort-by=memory
     ```
  
  2. 检查是否存在内存泄漏:
     - 监控进程内存是否持续增长
     - 检查应用日志中的内存相关错误
     - 使用内存分析工具分析应用
  
  3. 优化内存使用:
     - 审查和调整应用的内存配置
     - 实现合理的缓存策略
     - 调整Java应用的堆内存配置
  
  4. 优化资源分配:
     - 调整Pod的内存请求和限制
     - 使用HorizontalPodAutoscaler横向扩展应用
     - 为内存密集型应用配置垂直自动缩放
  
  5. 如果问题持续存在:
     - 增加节点内存
     - 考虑在集群中添加新节点
     - 改进应用负载均衡策略

# 标签，用于过滤和分组
tags:
  - memory
  - performance
  - node
  - resources
  - monitoring
