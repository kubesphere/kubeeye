---
# 容器重启次数检查规则
id: prometheus_container_restarts
name: 容器重启次数检查
description: 检查Pod中的容器重启次数是否过多，频繁重启可能表明应用存在稳定性问题或资源不足
type: prometheus
category: stability
severity: warning
enabled: true
tier: basic  # 基础层规则，适用于所有集群

# 规则配置
config:
  # 查询配置
  query:
    promql: 'max by(namespace, pod) (kube_pod_container_status_restarts_total)'  # PromQL查询表达式
    duration: "1h"              # 查询时间范围
    interval: "5m"              # 查询间隔
  
  # 阈值配置
  thresholds:
    warning: 5                 # 5次重启触发警告
    critical: 10               # 10次重启触发严重警告
    comparator: ">"             # 比较操作符: >
  
  # 告警配置
  alert:
    summary: "容器{{$labels.pod}}重启次数过多"        # 告警摘要，使用模板变量
    description: "命名空间{{$labels.namespace}}中的容器{{$labels.pod}}在过去1小时内重启{{$value}}次"    # 告警描述

# 问题解决建议
solution: |
  容器频繁重启可能表明存在应用程序错误、配置问题或资源限制不合理。请按照以下步骤排查:
  
  1. 检查容器日志以查找错误:
     ```bash
     kubectl logs pod/<pod名称> -n <命名空间> --previous
     kubectl logs pod/<pod名称> -n <命名空间>
     ```
  
  2. 检查与Pod相关的事件:
     ```bash
     kubectl describe pod/<pod名称> -n <命名空间>
     ```
  
  3. 常见容器重启原因及解决方法:
     - **OOMKilled**: 容器内存使用超过限制
       解决: 增加内存限制或优化应用内存使用
     - **CrashLoopBackOff**: 应用程序启动失败
       解决: 检查应用配置、依赖服务是否可用
     - **LivenessProbe失败**: 健康检查未通过
       解决: 调整探针参数或修复应用健康检查问题
  
  4. 检查应用日志中的错误并修复根本原因
  
  5. 考虑调整资源请求和限制，确保应用有足够资源运行

# 标签，用于过滤和分组
tags:
  - pod
  - stability
  - container
  - reliability
  - monitoring

