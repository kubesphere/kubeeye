---
# Prometheus节点CPU使用率检查规则
id: prometheus_node_cpu_usage
name: 节点CPU使用率检查
description: 通过Prometheus监控节点CPU使用率，及时发现性能瓶颈和资源压力
type: prometheus
category: performance
severity: warning
enabled: true
tier: standard  # 标准层规则，适用于生产环境

# 规则配置
config:
  # 查询配置
  query:
    promql: 'avg by (instance) (rate(node_cpu_seconds_total{mode!="idle"}[5m])) * 100'
    duration: "5m"  # 查询时间范围
    interval: "1m"  # 查询间隔

  # 阈值配置 - 使用thresholds替代threshold
  thresholds:
    warning: 80    # CPU使用率超过80%触发警告
    critical: 90   # CPU使用率超过90%触发严重警告
    comparator: ">"  # 比较操作符：> >= < <= == !=
    
  # 告警配置
  alert:
    summary: "节点 {{ $labels.instance }} CPU使用率高"
    description: "节点 {{ $labels.instance }} CPU使用率为 {{ $value | printf \"%.2f\" }}%，已持续 {{ $duration }}"

# 问题解决建议
solution: |
  CPU使用率过高，请执行以下操作：
  1. 使用 'kubectl top nodes' 和 'kubectl top pods --all-namespaces' 确认资源使用情况
  2. 查看占用CPU较高的Pod和进程: kubectl describe pod <pod-name>
  3. 检查Pod日志寻找异常行为: kubectl logs <pod-name>
  4. 分析应用性能瓶颈，查看是否存在高负载操作或死循环
  5. 考虑优化应用代码、算法或配置参数
  6. 调整Pod资源限制和请求: resources.limits.cpu 和 resources.requests.cpu
  7. 必要时增加节点资源或进行水平扩展
  8. 检查集群调度策略是否合理，避免资源分配不均

# 标签，用于过滤和分组
tags:
  - cpu
  - performance
  - prometheus
  - resource-usage
  - node
