# Node规则标准模板
---
id: node_rule_id                # 规则唯一标识符，使用下划线分隔单词
name: 规则名称                   # 简短易懂的名称
description: 规则详细描述        # 完整描述规则的目的和检查内容
type: node                     # 规则类型: node
category: system|security|performance|availability  # 规则分类
severity: info|warning|critical # 严重程度
enabled: true                  # 是否默认启用
tier: basic|standard|extended   # 规则层级: 基础、标准、扩展

# 规则配置
config:
  # 执行配置
  execution:
    command: "执行命令"         # 要执行的Shell命令
    parser: "parser_name"      # 解析器名称
    timeout: 30                # 超时时间（秒）
    dependencies:              # 依赖命令，可选
      key: "command"           # 在解析器中可通过key访问command的执行结果
  
  # 统一的阈值配置
  thresholds:
    warning:                   # 警告级别阈值
      param1: value1
    critical:                  # 严重级别阈值
      param1: value2
  
  # 应用范围
  scope:
    node_selector:             # 节点选择器
      key: value               # Kubernetes节点标签

# 问题解决建议
solution: |
  详细的问题解决步骤...
  1. 第一步
  2. 第二步
  3. 第三步

# 标签，用于过滤和分组
tags:
  - tag1
  - tag2
