version: '3.8'

services:
  kubeeye:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - kubeeye-data:/app/data
      # 开发模式：挂载源代码用于实时开发
      # - .:/app
    environment:
      - PYTHONPATH=/app
      - KUBEEYE_DATA_DIR=/app/data
      - STREAMLIT_SERVER_HEADLESS=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  kubeeye-data:
    driver: local

networks:
  default:
    name: kubeeye-network
